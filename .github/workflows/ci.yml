name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    # Windows y no ubuntu: el target es el instalador NSIS de Windows y la
    # suite de auditoria recorre rutas del disco (%APPDATA%, backslashes).
    # Correrla en Linux probaria otro programa del que se distribuye.
    name: Lint + auditoría + build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría (seguridad y correctitud)
        run: npm run audit

      - name: Build del renderer
        run: npx vite build

      - name: Empaquetar sin publicar
        run: npx electron-builder --dir
